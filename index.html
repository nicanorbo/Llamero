.setup-title{font-size:54px;line-height:.9;margin:0 0 8px}.setup-sub{font:700 14px/1.45 "Inter","Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:var(--muted);margin:0 0 20px}.setup-divider{height:1px;background:var(--line);margin:18px 0}.choice-label{font:800 10px "Inter","Segoe UI Variable","Segoe UI",system-ui,sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:0 0 8px}.region-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pick-radio{position:absolute;opacity:0;pointer-events:none}.select-card{display:flex;align-items:center;justify-content:center;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#121214;color:#d4d4d8;font:800 12px "Inter","Segoe UI Variable","Segoe UI",system-ui,sans-serif;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:.15s ease}.select-card.role-card{min-height:94px;flex-direction:column;gap:5px;text-align:center}.select-card.role-card b{font-size:25px;font-family:"Arial Narrow",Impact,sans-serif}.select-card.role-card span{font:700 11px/1.35 "Inter","Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:var(--muted);text-transform:none;letter-spacing:0}.pick-radio:checked+.select-card{background:#f4f4f5;color:#0a0a0b;border-color:#f4f4f5}.pick-radio:checked+.select-card span{color:#4b4b52}.role-chip{display:inline-flex;padding:5px 8px;border-radius:8px;background:#18181b;border:1px solid var(--line);font:800 10px "Inter","Segoe UI Variable","Segoe UI",system-ui,sans-serif;letter-spacing:.7px;color:#dedee3}.career-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0 22px}.career-meta span{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#121214;font:800 10px "Inter","Segoe UI Variable","Segoe UI",system-ui,sans-serif;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}

.champion-overlay{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:rgba(0,0,0,.72);animation:champFade .28s ease both}.champion-card{width:min(520px,88vw);padding:34px 28px;text-align:center;border:1px solid #3c3c42;border-radius:18px;background:#101012;box-shadow:0 30px 100px rgba(0,0,0,.65);animation:champPop .65s cubic-bezier(.2,.9,.2,1.1) both}.fncs-trophy{font-size:110px;line-height:1;filter:drop-shadow(0 16px 28px rgba(255,205,80,.18));animation:trophyBounce 1.05s ease-in-out infinite alternate}.champion-card h2{font-size:56px;line-height:.88;margin:10px 0 8px}.champion-card p{font:700 14px "Inter","Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:#aaaab3}.confetti{position:absolute;width:8px;height:18px;border-radius:2px;animation:confettiDrop 1.8s ease-in forwards}.confetti:nth-child(odd){background:#f5c451}.confetti:nth-child(even){background:#8d8d95}@keyframes champFade{from{opacity:0}to{opacity:1}}@keyframes champPop{0%{opacity:0;transform:scale(.65) translateY(30px)}70%{transform:scale(1.04) translateY(0)}100%{opacity:1;transform:scale(1)}}@keyframes trophyBounce{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-10px) rotate(2deg)}}@keyframes confettiDrop{0%{transform:translateY(-15vh) rotate(0);opacity:1}100%{transform:translateY(65vh) rotate(520deg);opacity:0}}

.ovr-change-overlay{position:fixed;inset:0;z-index:260;display:grid;place-items:center;background:rgba(0,0,0,.46);backdrop-filter:blur(3px);opacity:0;transition:opacity .2s ease;pointer-events:none}.ovr-change-overlay.show{opacity:1}.ovr-change-overlay.leave{opacity:0}.ovr-change-card{min-width:300px;padding:28px 36px;border:1px solid #39393f;border-radius:18px;background:#0b0b0d;text-align:center;box-shadow:0 26px 90px rgba(0,0,0,.62);animation:ovrCard .62s cubic-bezier(.16,.9,.2,1.18)}.ovr-change-card small{font:800 10px "Inter","Segoe UI Variable","Segoe UI",system-ui,sans-serif;letter-spacing:1.8px;color:#777;text-transform:uppercase}.ovr-shift{display:flex;align-items:center;justify-content:center;gap:18px;margin:12px 0 6px}.ovr-shift span{font-size:82px;line-height:.82;font-weight:900;text-shadow:0 0 24px currentColor}.ovr-shift b{font-size:26px;color:#5c5c62}.ovr-delta{font:900 18px "Inter","Segoe UI Variable","Segoe UI",system-ui,sans-serif}.ovr-delta.up{color:#39d98a}.ovr-delta.down{color:#ff5f78}

function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;} function clamp(v,a,b){return Math.max(a,Math.min(b,v));} function pick(arr){return arr[Math.floor(Math.random()*arr.length)];} function money(n){return '$'+Math.round(n).toLocaleString('en-US');} function shortMoney(n){if(n>=1000000)return '$'+(n/1000000).toFixed(2).replace(/\.00$/,'')+'M'; if(n>=1000)return '$'+(n/1000).toFixed(1).replace(/\.0$/,'')+'K'; return '$'+n;} function ordinal(n){let s=['TH','ST','ND','RD'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);} function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function skinFor(id){if(PLAYER_SPECIAL[id])return PLAYER_SPECIAL[id]; if(PLAYER_FACE_URLS[id])return PLAYER_FACE_URLS[id]; let h=0; for(let i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0; const src=SKIN_IMAGES[h%SKIN_IMAGES.length]; return src.startsWith('http')?src:('assets_v17/'+src);}
function effectClass(label){const s=String(label).toLowerCase(); return (s.includes('-')||s.includes('ban')||s.includes('pierd')||s.includes('riesgo')||s.includes('agot')) ? 'neg' : 'pos';}
function ovrClass(v){if(v>=99)return 'ovr-max'; if(v>=95)return 'ovr-purple'; if(v>=90)return 'ovr-blue'; if(v>=80)return 'ovr-gold'; if(v>=70)return 'ovr-silver'; return 'ovr-bronze';}
function regionLegend(){const map={SA:'k1ng',NA:'Peterbot',EU:'Malibuca',OCE:'Jynxen',ASIA:'Riku',ME:'Faris'}; return map[state.profile.region]||'k1ng';}
function autoQualifyToFNCS(source){
  state.seasonFlags.qualified=true;
  const nextSeason=state.queue.findIndex(step=>step[0]==='season');
  const currentPart=nextSeason===-1 ? state.queue.slice() : state.queue.slice(0,nextSeason);
  const laterPart=nextSeason===-1 ? [] : state.queue.slice(nextSeason);
  const cleaned=currentPart.filter(step=>!(step[0]==='tour' && (step[1]==='qual'||step[1]==='last'||step[1]==='major')));
  state.queue=[['tour','major'],...cleaned,...laterPart];

function earlySeasonDevelopment(season){
  // El crecimiento fuerte ocurre al principio de la carrera.
  // Se ejecuta al comenzar cada temporada y siempre respeta el límite 99.
  if(season===1) return; // la temporada 1 arranca con el OVR actual

  let delta=0;
  if(state.age===13) delta=rand(2,3);
  else if(state.age===14) delta=rand(1,3);
  else if(state.age===15) delta=rand(1,2);
  else if(state.age===16) delta=rand(0,2);
  else if(state.age<=state.careerPeakAge) delta=rand(0,1);

  if(state.hidden.burnout>=25) delta=Math.max(0,delta-1);

  const gapToCeiling=state.hidden.potential-state.ovr;
  if(gapToCeiling<=0) delta=0;
  else if(gapToCeiling<=2) delta=Math.min(delta,Math.random()<0.35?1:0);
  else if(gapToCeiling<=5) delta=Math.min(delta,1);

  if(delta>0){
    const before=state.ovr;
    state.ovr=Math.min(state.hidden.potential,clamp(state.ovr+delta,45,99));
    const real=state.ovr-before;
    if(real>0){
      state.naturalDelta=real;
      state.lastNaturalOvrBefore=before;
      state.news.unshift('CRECIMIENTO DE TEMPORADA: +'+real+' OVR.');
    }
  }
}

function nextStep(){

    state.seasonInYear=step[1];
    state.seasonFlags={qualified:false,lastChance:false};
    if(state.bannedSeasons>0) skipBannedSeason();
    else{

function roleTournamentBonus(tid){

    if(['victory','reload','solo','cash'].includes(tid)) return -0.6;

function simulatePlacement(t,tid){
  let strength=duoStrength()+roleTournamentBonus(tid);
  const regionFactor={SA:.97,NA:1.03,EU:1.09,OCE:.95,ASIA:.99,ME:1.01}[state.profile.region];
  let diff=t.difficulty*regionFactor;
  if(tid==='qual') diff-=1;
  if(tid==='last') diff-=0.5;

  // Chemistry alta y burnout bajo tienen un impacto visible en cualquier torneo.
  const chemistryForm=(state.chemistry-50)*.035;
  const burnoutForm=(12-state.hidden.burnout)*.055;
  strength += chemistryForm + burnoutForm;

  const z=(strength-diff)/8.2;
  let percentile=1/(1+Math.exp(-z));
  percentile=clamp(percentile+(Math.random()-.5)*.26,.004,.992);
  let place=Math.max(1,Math.min(t.field,Math.floor((1-percentile)*t.field)+1));

  if(tid==='major'){
    // Si llegaste al nivel máximo de 99 y todavía nunca ganaste una FNCS,
    // la próxima FNCS que juegues se convierte en tu primera victoria.
    if(state.ovr===99 && state.trophies.fncs===0){
      return 1;
    }

    // No se puede ganar una FNCS con 80 OVR o menos.
    if(state.ovr<=80){
      place=Math.max(2,place);
      return place;
    }

    let baseChance=0.015;
    if(state.ovr>=99) baseChance=.52;
    else if(state.ovr>=97) baseChance=.31;
    else if(state.ovr>=94) baseChance=.23;
    else if(state.ovr>=91) baseChance=.16;
    else if(state.ovr>=88) baseChance=.105;
    else if(state.ovr>=85) baseChance=.065;
    else if(state.ovr>=83) baseChance=.038;
    else baseChance=.02;

    // Chemistry 100 puede sumar hasta +8 puntos porcentuales.
    const chemistryBonus=((state.chemistry-50)/50)*.08;
    // Burnout 0 puede sumar +6pp; burnout muy alto puede restar hasta -10pp.
    const burnoutBonus=((12-state.hidden.burnout)/23)*.09;
    let winChance=clamp(baseChance+chemistryBonus+burnoutBonus,.005,.55);

    if(Math.random()<winChance) place=1;
    else if(state.ovr>=95 && Math.random()<.38) place=Math.min(place,rand(2,6));
    else if(state.ovr>=88 && Math.random()<.24) place=Math.min(place,rand(2,10));
  } else if(Math.random()<.025&&strength>diff-3) place=1;

  return place;
}

function runEvent(id){
  if(!state.recentDecisionTitles) state.recentDecisionTitles=[];
  let data=eventData(id);
  const fixed=['xvparty','graduation','appreciation','legendcoach','banseason'];
  if(!fixed.includes(id)){
    for(let tries=0;tries<12 && data && state.recentDecisionTitles.includes(data.title);tries++) data=eventData(id);
  }
  if(data){state.recentDecisionTitles.unshift(data.title);state.recentDecisionTitles=state.recentDecisionTitles.slice(0,18);}
  state.pending={type:'event',data}; saveGame(); renderEvent(data);
}
let choiceLocked=false;
function selectDecision(choice,button){
  if(choiceLocked)return; choiceLocked=true;
  const card=button.closest('.action-card');
  const grid=card?.parentElement;
  if(card)card.classList.add('choice-selected');
  if(grid)[...grid.querySelectorAll('.action-card')].forEach(c=>{if(c!==card)c.classList.add('choice-rejected');});
  setTimeout(()=>applyEvent(choice),430);
}
function showOvrChange(before,after,callback,label='OVR UPDATE'){
  const delta=after-before;
  const overlay=document.createElement('div'); overlay.className='ovr-change-overlay';
  overlay.innerHTML=`<div class="ovr-change-card"><small>${label}</small><div class="ovr-shift"><span class="${ovrClass(before)}">${before}</span><b>→</b><span class="${ovrClass(after)}">${after}</span></div><div class="ovr-delta ${delta>=0?'up':'down'}">${delta>0?'+':''}${delta} OVR</div></div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>overlay.classList.add('show'),20);
  setTimeout(()=>{overlay.classList.add('leave');setTimeout(()=>{overlay.remove();if(callback)callback();},240);},900);
}
function applyEvent(choice){
  const data=state.pending.data, fn=choice==='a'?data.fa:data.fb; state.pending=null; const beforeOvr=state.ovr; const beforeBurnout=state.hidden.burnout; const result=fn&&fn();
  // Las decisiones que suben burnout ahora lo hacen aproximadamente a la mitad.
  if(state.hidden.burnout>beforeBurnout){
    const increase=state.hidden.burnout-beforeBurnout;
    state.hidden.burnout=beforeBurnout+Math.max(1,Math.ceil(increase*.5));
  }
  // Casi todas las mejoras respetan el techo natural de esta carrera.
  // Eventos especiales explícitos pueden marcar allowBeyondPotential=true.
  if(state.ovr>beforeOvr && !data.allowBeyondPotential){
    state.ovr=Math.min(state.ovr,state.hidden.potential);
  }
  state.hidden.mental=clamp(state.hidden.mental,25,100); state.hidden.burnout=clamp(state.hidden.burnout,0,35); state.hidden.prep=clamp(state.hidden.prep,0,25); state.chemistry=clamp(state.chemistry,0,100); state.ovr=clamp(state.ovr,45,99);
  if(state.ovr!==beforeOvr && !data.silent)state.news.unshift('TU OVR CAMBIÓ: '+beforeOvr+' → '+state.ovr+'.');
  saveGame(); choiceLocked=false;
  if(result==='interrupt')return;
  if(state.ovr!==beforeOvr) showOvrChange(beforeOvr,state.ovr,()=>nextStep()); else nextStep();
}

function naturalCareerDevelopment(){
  const peak=state.careerPeakAge||20;
  let delta=0;
  if(state.age<peak){
    if(state.age<=14) delta=rand(0,1);
    else if(state.age<=16) delta=rand(0,1);
    else delta=rand(0,2);
  } else if(state.age===peak){
    delta=rand(0,1);
  } else {
    const yearsPast=state.age-peak;
    if(yearsPast===1) delta=-rand(0,1);
    else if(yearsPast<=3) delta=-rand(1,2);
    else if(yearsPast<=5) delta=-rand(1,3);
    else delta=-rand(2,4);
  }
  // Cerca del techo natural, progresar se vuelve cada vez más difícil.
  const gapToCeiling=state.hidden.potential-state.ovr;
  if(delta>0 && gapToCeiling<=0) delta=0;
  else if(delta>0 && gapToCeiling<=2) delta=Math.min(delta,Math.random()<0.30?1:0);
  else if(delta>0 && gapToCeiling<=5) delta=Math.min(delta,1);

  // burnout can push a season down; good mental can soften decline
  if(state.hidden.burnout>=24) delta-=1;
  if(state.hidden.mental>=85 && delta<0) delta+=1;
  const before=state.ovr; state.lastNaturalOvrBefore=before;
  state.ovr=Math.min(state.hidden.potential,clamp(state.ovr+delta,45,99));
  state.naturalDelta=state.ovr-before;
  if(state.naturalDelta>0) state.news.unshift('DESARROLLO NATURAL: +'+state.naturalDelta+' OVR.');
  if(state.naturalDelta<0) state.news.unshift('TU PEAK QUEDÓ ATRÁS: '+state.naturalDelta+' OVR.');
}
function endSeason(){
  const result=state.lastResult;
  state.history.push({year:state.year,age:state.age,region:state.profile.region,teammate:state.teammate,ovr:state.ovr,pr:state.powerRanking,earnings:result?result.earnings:0,best:result?`${result.name} ${ordinal(result.place)}`:'—'});
  naturalCareerDevelopment();
  state.ovr=clamp(state.ovr,45,99);
  state.hidden.prep=0;
  state.chemistry=clamp(state.chemistry+rand(1,4),0,100);
  PLAYER_LIST.forEach(p=>{if(!p.active)return; p.age++; const gap=p.hidden.potential-p.hidden.base; if(p.age<=23&&gap>0&&Math.random()<.55)p.hidden.base=clamp(p.hidden.base+Math.max(0,Math.round((gap/10)*Math.random())),40,p.hidden.potential); else if(p.age>=27&&Math.random()<.7)p.hidden.base=clamp(p.hidden.base-rand(0,2),40,99); p.form=clamp(p.form+rand(-2,2),-6,6); if(p.age>=28&&Math.random()<.12)p.active=false;});
  state.age++; state.year++; state.seasonInYear=1;
  const mate=getPlayer(state.teammate);
  if(mate&&!mate.active){state.news.unshift(mate.name.toUpperCase()+' ANUNCIÓ SU RETIRO.'); state.teammate=null;}
  if(state.age>30){finishCareer(30);return;}
  if(state.age>=25){renderRetirementDecision();return;}
  if(!state.teammate&&state.bannedSeasons<=0){chooseTeammatesScreen();return;}
  startSeason(); renderCareer(); if(state.naturalDelta!==0)setTimeout(()=>showOvrChange(state.lastNaturalOvrBefore,state.ovr,null,'DESARROLLO NATURAL'),260);
}
function legacyScore(){let score=35+state.trophies.fncs*7+state.trophies.global*14+state.trophies.cups*1.5+Math.min(18,Math.log10(state.earnings+10)*2.8)+Math.min(18,state.powerRanking/180); return clamp(Math.round(score),1,100);} function finishCareer(age){state.retired=true;state.retireAge=age;state.pending=null;let hall=[]; try{hall=JSON.parse(localStorage.getItem('llamero_v26_hof')||localStorage.getItem('llamero_v21_hof')||'[]');}catch(e){} const duos=Array.isArray(state.duoHistory)?state.duoHistory.slice():[]; if(currentMate()&&!duos.includes(currentMate().name))duos.push(currentMate().name); hall.push({name:state.profile.name,legacy:legacyScore(),earnings:state.earnings,age,peakPR:state.powerRanking,fncs:state.trophies.fncs,duos}); hall.sort((a,b)=>b.legacy-a.legacy); hall=hall.slice(0,10); localStorage.setItem('llamero_v26_hof',JSON.stringify(hall)); saveGame(); renderCareerEnd();} function retirementContinue(){state.pending=null;state.hidden.burnout=clamp(state.hidden.burnout+3,0,35);startSeason();saveGame();renderCareer();return 'interrupt';}
function currentMate(){return getPlayer(state.teammate);} function valueText(){const val=Math.max(50000, state.ovr*3500 + state.powerRanking*30 + state.trophies.fncs*50000 + state.trophies.global*90000); if(val>=1000000) return '€'+(val/1000000).toFixed(1).replace(/\.0$/,'')+'M'; return '€'+Math.round(val/1000)+'K';}
function burnoutPercent(){return clamp(Math.round((state.hidden.burnout/35)*100),0,100);}
function burnoutLabel(){const v=state.hidden.burnout;return v<=9?'BAJO':v<=19?'CONTROLADO':v<=27?'ALTO':'CRÍTICO';}

function historyStats(){return {played:state.history.length, wins:state.trophies.cups+state.trophies.fncs+state.trophies.global, assists:Math.max(0,Math.floor(state.powerRanking/70))};}
function shell(inner){document.getElementById('app').innerHTML=inner;}
function timelineRows(){let out=''; for(let age=13; age<=30; age++){const past=state.history.find(h=>h.age===age); let label=''; let ovr=''; let pj=''; let pr=''; let earn=''; let cls='row'; if(age===state.age){cls+=' current'; label=state.pending&&state.pending.type==='event' ? 'Decisión de carrera...' : (currentMate()?currentMate().name:'Eligiendo dúo...'); ovr=state.ovr; pj=state.history.length; pr=state.powerRanking; earn=shortMoney(state.earnings);} else if(past){cls+=' active'; label=getPlayer(past.teammate)?.name || REGIONS[past.region].short; ovr=past.ovr; pj=past.age-12; pr=past.pr; earn=shortMoney(past.earnings);} else label=''; out+=`<div class="${cls}"><div class="age">${age}</div><div class="club">${esc(label)}</div><div class="ovr-cell">${ovr!==''?`<span class="pill ovr-num ${ovrClass(Number(ovr))}">${ovr}</span>`:''}</div><div class="cell">${pj}</div><div class="cell">${pr}</div><div class="cell">${earn}</div></div>`; } return out;}
function leftHeader(){const mate=currentMate(); const hs=historyStats(); return `<div class="header-top"><div class="ovr-badge"><small>OVR</small><b class="ovr-num ${ovrClass(state.ovr)}">${state.ovr}</b></div><div class="id-area"><div class="tags"><span class="tag">${state.profile.region}</span><span class="tag">${esc(state.profile.role||'FRAGGER')}</span><span class="season-chip">TEMP ${state.seasonInYear||1}/3</span></div><h1 class="player-name">${esc(state.profile.name)}</h1><div class="subline"><div class="club-line">${mate?esc(mate.name):'Libre'}</div><div class="meta-box"><small>Edad</small><div class="age">${state.age}</div><small>Valor</small><div class="value">${valueText()}</div></div></div></div></div><div class="stat-strip"><div class="micro"><small>Años</small><b>${hs.played}</b></div><div class="micro"><small>PR</small><b>${state.powerRanking}</b></div><div class="micro"><small>Earnings</small><b>${shortMoney(state.earnings)}</b></div></div><div class="condition-grid"><div class="condition-card"><div class="condition-head"><span>Chemistry</span><b>${state.chemistry} · ${chemistryLabel()}</b></div><div class="condition-meter chem"><i style="width:${clamp(state.chemistry,0,100)}%"></i></div><small class="condition-note">Más alta = mejor rendimiento del dúo.</small></div><div class="condition-card"><div class="condition-head"><span>Burnout</span><b>${burnoutPercent()}% · ${burnoutLabel()}</b></div><div class="condition-meter burn"><i style="width:${burnoutPercent()}%"></i></div><small class="condition-note">Sube de forma gradual; descansar y algunas decisiones lo reducen.</small></div></div><div class="palmares-box" role="button" tabindex="0" onclick="openPalmares()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openPalmares()}"><div class="palmares-head"><strong>Palmarés</strong><span>VER TODO ›</span></div><div class="palmares-grid"><div class="palmares-tile"><b>${state.trophies.fncs}</b><small>FNCS</small></div><div class="palmares-tile"><b>${state.trophies.global}</b><small>Global</small></div><div class="palmares-tile"><b>${state.trophies.cups}</b><small>Cups</small></div></div></div>`;}
function rightPanelFooter(){return `<div class="right-footer"><div>🌎 ${REGIONS[state.profile.region].name}</div><div class="footer-stats"><span>OVR ${state.ovr}</span><span>PR ${state.powerRanking}</span><span>${shortMoney(state.earnings)}</span></div></div>`;}
function renderCareer(){const mate=currentMate(); const statusTitle = mate ? 'Próximo paso' : 'Oferta de dúo'; const statusCopy = mate ? (state.news[0]||'Seguí construyendo tu carrera.') : 'Elegí con quién empieza tu carrera.'; let bottomHtml=''; if(mate){bottomHtml=`<div class="section-title">${statusTitle}</div><p class="section-copy">${esc(statusCopy)}</p><div class="option-grid single"><div class="action-card result-card" role="button" tabindex="0" onclick="selectResultCard(()=>nextStep(),this)" onkeydown="resultKey(event,()=>nextStep(),this)"><div class="club-line">${state.bannedSeasons>0?'Baneado del competitivo: '+state.bannedSeasons+' temporadas restantes.':'Seguís disponible para competir.'}</div><span class="subbtn">CONTINUAR CARRERA</span></div></div>`;} else {bottomHtml=`<div class="section-title">Oferta de dúo</div><p class="section-copy">No tenés compañero. Elegí con quién querés empezar.</p><div class="option-grid single"><div class="action-card result-card" role="button" tabindex="0" onclick="selectResultCard(()=>chooseTeammatesScreen(),this)" onkeydown="resultKey(event,()=>chooseTeammatesScreen(),this)"><div class="club-line" style="font-size:15px;color:#eee">BUSCAR TEAMMATE</div><span class="subbtn">TOCÁ LA TARJETA</span></div></div>`;} shell(`<div class="shell screen-transition"><div class="main"><div class="left">${leftHeader()}${bottomHtml}</div><div class="right"><div class="timeline-head"><div>Edad</div><div>Teammate</div><div>OVR</div><div>TEMP</div><div>PR</div><div>$</div></div><div class="timeline">${timelineRows()}</div>${rightPanelFooter()}</div></div></div>`);}
function renderEvent(data){const bottom=`<div class="section-title">${esc(data.title)}</div><p class="section-copy">${esc(data.text)}</p><div class="option-grid"><div class="action-card decision-card" role="button" tabindex="0" onclick="selectDecisionCard('a',this)" onkeydown="choiceKey(event,'a',this)"><div class="pick-image"><img src="${data.imgA||data.img||DECISION_IMAGES.coach}"></div><h4>${esc(data.a)}</h4><div class="effect-stack">${(data.aEffects||[]).map(e=>`<span class="effect-pill ${effectClass(e)}">${esc(e)}</span>`).join('')}</div></div><div class="action-card decision-card" role="button" tabindex="0" onclick="selectDecisionCard('b',this)" onkeydown="choiceKey(event,'b',this)"><div class="pick-image"><img src="${data.imgB||data.img||DECISION_IMAGES.coach}"></div><h4>${esc(data.b)}</h4><div class="effect-stack">${(data.bEffects||[]).map(e=>`<span class="effect-pill ${effectClass(e)}">${esc(e)}</span>`).join('')}</div></div></div>`; shell(`<div class="shell screen-transition"><div class="main"><div class="left">${leftHeader()}${bottom}</div><div class="right"><div class="timeline-head"><div>Edad</div><div>Teammate</div><div>OVR</div><div>TEMP</div><div>PR</div><div>$</div></div><div class="timeline">${timelineRows()}</div>${rightPanelFooter()}</div></div></div>`);}
function showFNCSChampionAnimation(){
  const overlay=document.createElement('div'); overlay.className='champion-overlay';
  let conf=''; for(let i=0;i<22;i++){const left=5+Math.random()*90;const delay=Math.random()*.7;conf+=`<i class="confetti" style="left:${left}%;top:-20px;animation-delay:${delay}s"></i>`;}
  overlay.innerHTML=conf+`<div class="champion-card"><div class="fncs-trophy">🏆</div><h2>FNCS CHAMPION</h2><p>Ganaste la FNCS. Tu carrera acaba de cambiar.</p><button class="choose-btn" onclick="this.closest('.champion-overlay').remove()">CONTINUAR</button></div>`;
  document.body.appendChild(overlay);
}
function renderTournamentResult(){const r=state.lastResult; const extra = r.name.includes('QUALIFIER') ? (state.seasonFlags.qualified ? 'Clasificaste al Major.' : 'No clasificaste directo.') : 'Tu temporada sigue.'; state.pending={type:'resultProxy'}; saveGame(); const bottom=`<div class="section-title">${esc(r.name)}</div><p class="section-copy">Terminaste <b>${ordinal(r.place)}</b>. Tu total ahora es <b>${state.powerRanking} PR</b> y <b>${shortMoney(state.earnings)}</b> en earnings. Chemistry <b>${state.chemistry}</b> · Burnout <b>${burnoutPercent()}%</b>.</p><div class="option-grid"><div class="action-card result-card" role="button" tabindex="0" onclick="selectResultCard(()=>nextStep(),this)" onkeydown="resultKey(event,()=>nextStep(),this)"><div class="result-stat" style="font-size:66px;line-height:.85">${ordinal(r.place)}</div><div class="club-line">${r.earnings?('+'+money(r.earnings)):'$0'} · +${r.prGain} PR</div><span class="subbtn">CONTINUAR</span></div><div class="action-card result-card" role="button" tabindex="0" onclick="selectResultCard(()=>renderCareer(),this)" onkeydown="resultKey(event,()=>renderCareer(),this)"><div class="club-line" style="font-size:15px;color:#eee">${extra}</div><span class="subbtn">VOLVER A CARRERA</span></div></div>`; shell(`<div class="shell screen-transition"><div class="main"><div class="left">${leftHeader()}${bottom}</div><div class="right"><div class="timeline-head"><div>Edad</div><div>Teammate</div><div>OVR</div><div>TEMP</div><div>PR</div><div>$</div></div><div class="timeline">${timelineRows()}</div>${rightPanelFooter()}</div></div></div>`); if(r.tourId==='major'&&r.place===1)setTimeout(showFNCSChampionAnimation,220);}
function renderDuoChoice(a,b){
  const bottom=`<div class="section-title">Oferta de dúo</div><p class="section-copy">Dos jugadores quieren empezar contigo. Tocá la imagen o el nombre para elegir.</p><div class="option-grid"><div class="action-card duo-card" role="button" tabindex="0" onclick="selectTeammate('${a.id}',this)" onkeydown="teammateKey(event,'${a.id}',this)"><div class="pick-image player-skin" style="height:126px"><img src="${a.img}" onerror="this.onerror=null;this.src='https://fortnite-api.com/images/cosmetics/br/CID_397_Athena_Commando_F_TreasureHunterFashion/icon.png'"></div><h4>${esc(a.name)}</h4><span class="subbtn">${REGIONS[a.region].name}</span></div><div class="action-card duo-card" role="button" tabindex="0" onclick="selectTeammate('${b.id}',this)" onkeydown="teammateKey(event,'${b.id}',this)"><div class="pick-image player-skin" style="height:126px"><img src="${b.img}" onerror="this.onerror=null;this.src='https://fortnite-api.com/images/cosmetics/br/CID_493_Athena_Commando_F_JurassicArchaeology/icon.png'"></div><h4>${esc(b.name)}</h4><span class="subbtn">${REGIONS[b.region].name}</span></div></div>`;
  shell(`<div class="shell screen-transition"><div class="main"><div class="left">${leftHeader()}${bottom}</div><div class="right"><div class="timeline-head"><div>Edad</div><div>Teammate</div><div>OVR</div><div>TEMP</div><div>PR</div><div>$</div></div><div class="timeline">${timelineRows()}</div>${rightPanelFooter()}</div></div></div>`);
}
function renderRetirementDecision(){const data=evt('DECISIÓN DE CARRERA',`Tenés ${state.age} años y llevás ${state.age-13} años compitiendo. ¿Querés jugar un año más o retirarte?`,LOGO,'JUGAR UN AÑO MÁS','RETIRARME',['Más carrera','+ Burnout'],['Fin de carrera'],()=>retirementContinue(),()=>{state.pending=null;finishCareer(state.age);return 'interrupt';},DECISION_IMAGES.practice,DECISION_IMAGES.relax); state.pending={type:'event',data}; saveGame(); renderEvent(data);}
function renderCareerEnd(){shell(`<div class="menu-wrap"><div class="menu-card" style="grid-template-columns:1fr"><div class="menu-main"><img class="logo" src="${LOGO}"><h1>${esc(state.profile.name)}</h1><div class="club-line" style="font-size:22px;margin-bottom:12px">Legacy score</div><div style="font-size:110px;line-height:.85">${legacyScore()}</div><div class="section-copy">Retiro a los ${state.retireAge||state.age} · Peak PR ${state.powerRanking} · Earnings ${shortMoney(state.earnings)}</div><div class="stack"><button class="menu-btn" onclick="newCareerForm()">Nueva carrera</button><button class="menu-btn secondary" onclick="openHall()">Hall of Fame</button></div></div></div></div>`);}
function showMenu(){shell(`<div class="menu-wrap"><div class="menu-card"><div class="menu-main"><img class="logo" src="${LOGO}"><div class="kicker" style="margin-top:10px">FORTNITE CAREER SIM</div><h1>LLAMERO</h1><p class="helper" style="margin:0 auto 18px;max-width:430px">Tu carrera de Fortnite competitivo, desde los 13 hasta el retiro. Elegí región, rol, teammate y viví cada temporada.</p><div class="career-meta"><span>3 decisiones/año</span><span>3 torneos base/año</span><span>PR estilo Tracker</span></div><div class="stack"><button class="menu-btn" onclick="newCareerForm()">Crear carrera</button><button class="menu-btn secondary" onclick="continueCareer()" ${hasSave()?'':'disabled'}>Continuar</button><button class="menu-btn secondary" onclick="openHall()">Hall of Fame</button></div></div></div></div>`);}
function newCareerForm(){shell(`<div class="menu-wrap"><div class="form-card"><div class="kicker">NUEVA CARRERA</div><h1 class="setup-title">Creá tu jugador</h1><p class="setup-sub">La región cambia la dificultad competitiva. Tu rol modifica cómo rendís en cada tipo de torneo.</p><div class="field"><label>Nickname</label><input id="nick" value="PLAYER" maxlength="18"></div><div class="setup-divider"></div><div class="choice-label">Región inicial</div><div class="region-grid">${['SA','NA','EU','OCE','ASIA','ME'].map((k,i)=>`<label><input class="pick-radio" type="radio" name="region" value="${k}" ${i===0?'checked':''}><span class="select-card">${REGIONS[k].short}</span></label>`).join('')}</div><div class="setup-divider"></div><div class="choice-label">Tu rol</div><div class="role-grid"><label><input class="pick-radio" type="radio" name="role" value="IGL"><span class="select-card role-card"><b>IGL</b><span>Mejor en qualifiers, FNCS y endgame. Más difícil destacar en cups de pelea.</span></span></label><label><input class="pick-radio" type="radio" name="role" value="FRAGGER" checked><span class="select-card role-card"><b>FRAGGER</b><span>Mejor en Victory/Cash Cups y peleas. Menos ventaja en torneos largos.</span></span></label></div><div class="setup-divider"></div><div class="stack"><button class="menu-btn" onclick="startCareer()">Empezar carrera</button><button class="menu-btn secondary" onclick="showMenu()">Volver</button></div></div></div>`);}
function startCareer(){const name=document.getElementById('nick').value.trim()||'PLAYER'; const region=document.querySelector('input[name="region"]:checked')?.value||'SA'; const role=document.querySelector('input[name="role"]:checked')?.value||'FRAGGER'; state=freshState({name,region,role}); localStorage.removeItem('llamero_v26_save'); startSeason(); chooseTeammatesScreen();}
function continueCareer(){if(!loadGame()){showMenu();return;} if(!state.recentDecisionTitles)state.recentDecisionTitles=[]; if(state.retired){renderCareerEnd();return;} if(!state.queue)state.queue=[]; if(state.queue.length===0 && !state.pending)startSeason(); if(state.pending&&state.pending.type==='event'){renderEvent(state.pending.data);return;} if(state.pending&&state.pending.type==='duo'){renderDuoChoice(getPlayer(state.pending.a),getPlayer(state.pending.b));return;} renderCareer();}
function modal(title,inner){const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='modal'; bg.innerHTML=`<div class="modal"><button class="close" onclick="document.getElementById('modal').remove()">✕</button><h2>${esc(title)}</h2>${inner}</div>`; document.body.appendChild(bg);}
function openCareerHistory(){if(!state)return; const rows=[...state.history].reverse().map(h=>`<tr><td>${h.year}</td><td>${h.age}</td><td>${REGIONS[h.region].short}</td><td>${esc(getPlayer(h.teammate)?.name||'—')}</td><td>${h.ovr}</td><td>${h.pr} PR</td><td>${money(h.earnings)}</td><td>${esc(h.best)}</td></tr>`).join(''); modal('Carrera',`<table><thead><tr><th>Año</th><th>Edad</th><th>Región</th><th>Teammate</th><th>OVR</th><th>PR</th><th>Earnings</th><th>Mejor resultado</th></tr></thead><tbody>${rows||'<tr><td colspan="8">Todavía no terminó ninguna temporada.</td></tr>'}</tbody></table>`);}

function openPalmares(){if(!state)return;ensurePalmares();const p=state.palmares;const bestFncs=p.bestFNCS?ordinal(p.bestFNCS):'—';const bestGlobal=p.bestGlobal?ordinal(p.bestGlobal):'—';const recent=(p.recent||[]).map(x=>`<div class="honour"><strong>${esc(x.event)} · ${ordinal(x.place)}</strong><span>${x.year} · +${x.prGain||0} PR${x.earnings?' · '+money(x.earnings):''}</span></div>`).join('')||'<div class="honour"><strong>Todavía no hay grandes resultados.</strong><span>Seguí compitiendo</span></div>'; modal('Palmarés',`<div class="palmares-summary"><div class="palmares-stat"><b class="palmares-major">${state.trophies.fncs}</b><small>FNCS ganadas</small></div><div class="palmares-stat"><b>${state.trophies.global}</b><small>Globales</small></div><div class="palmares-stat"><b>${p.totalWins||0}</b><small>Victorias</small></div><div class="palmares-stat"><b>${p.top10s||0}</b><small>Top 10</small></div></div><table><tbody><tr><td>Mejor FNCS</td><td><b>${bestFncs}</b></td></tr><tr><td>Podios FNCS</td><td><b>${p.fncsPodiums||0}</b></td></tr><tr><td>Mejor Global</td><td><b>${bestGlobal}</b></td></tr><tr><td>Podios Global</td><td><b>${p.globalPodiums||0}</b></td></tr><tr><td>Cash/Victory Cups ganadas</td><td><b>${state.trophies.cups}</b></td></tr><tr><td>Eventos jugados</td><td><b>${p.events||0}</b></td></tr><tr><td>Mayor premio</td><td><b>${money(p.biggestPrize||0)}</b></td></tr><tr><td>Power Ranking actual</td><td><b>${state.powerRanking} PR</b></td></tr><tr><td>Earnings de carrera</td><td><b>${shortMoney(state.earnings)}</b></td></tr></tbody></table><div class="section-title" style="margin-top:16px">Resultados destacados</div><div class="honour-list">${recent}</div>`);}
function openHall(){let hall=[]; try{hall=JSON.parse(localStorage.getItem('llamero_v26_hof')||localStorage.getItem('llamero_v21_hof')||'[]');}catch(e){} const rows=hall.map((h,i)=>{const duos=Array.isArray(h.duos)&&h.duos.length?h.duos.join(' · '):'—';return `<tr><td>${i+1}</td><td><b>${esc(h.name)}</b></td><td>${h.legacy}</td><td><b>${shortMoney(h.earnings||0)}</b></td><td class="hall-duos">${esc(duos)}</td><td>${h.age}</td><td>${h.peakPR} PR</td><td>${h.fncs}</td></tr>`;}).join(''); modal('Hall of Fame',`<table><thead><tr><th>#</th><th>Jugador</th><th>Legacy</th><th>Earnings carrera</th><th>Dúos de la carrera</th><th>Retiro</th><th>Peak PR</th><th>FNCS</th></tr></thead><tbody>${rows||'<tr><td colspan="8">Todavía no hay carreras terminadas.</td></tr>'}</tbody></table>`);}
showMenu();
</script>
</body>
</html>
